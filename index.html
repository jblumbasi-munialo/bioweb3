<!DOCTYPE html>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Floating Chatbot Styles */
        .chatbot-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        .chatbot-toggle {
            background: linear-gradient(135deg, #2c7a47, #1e5a34);
            border: none;
            border-radius: 50px;
            padding: 12px 24px;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .chatbot-toggle:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #1e5a34, #0d3b0f);
        }
        .chatbot-window {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 350px;
            height: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
            border: 1px solid #ddd;
        }
        .chatbot-header {
            background: linear-gradient(135deg, #2c7a47, #1e5a34);
            color: white;
            padding: 12px 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chatbot-header button {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        .chatbot-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
        }
        .chatbot-input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            background: white;
        }
        .chatbot-input-area input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
        }
        .chatbot-input-area button {
            background: #2c7a47;
            border: none;
            color: white;
            border-radius: 20px;
            padding: 8px 16px;
            margin-left: 8px;
            cursor: pointer;
        }
        .message-bubble {
            margin-bottom: 12px;
            max-width: 85%;
            clear: both;
        }
        .user-bubble {
            background: #2c7a47;
            color: white;
            padding: 8px 12px;
            border-radius: 18px 18px 4px 18px;
            float: right;
        }
        .bot-bubble {
            background: #e9ecef;
            color: #1a1a1a;
            padding: 8px 12px;
            border-radius: 18px 18px 18px 4px;
            float: left;
        }
        .system-bubble {
            background: #fff3cd;
            color: #856404;
            text-align: center;
            font-size: 12px;
            padding: 5px;
            border-radius: 10px;
            clear: both;
        }
        @media (max-width: 480px) {
            .chatbot-window { width: 300px; height: 450px; right: 10px; bottom: 70px; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand" href="#"><i class="fas fa-dna"></i> BioWeb3</a>
        <button id="connectWallet" class="btn btn-outline-light"><i class="fas fa-wallet"></i> Connect Wallet</button>
    </div>
</nav>

<div class="container" style="margin-top: 80px;">
    <!-- Main content (same as before) -->
    ... (keep all your existing tabs: Sequence, AlphaFold, Docking, Blockchain, Pricing)

</div>

<!-- FLOATING CHATBOT -->
<div class="chatbot-float">
    <button class="chatbot-toggle" id="chatbotToggleBtn">
        <i class="fas fa-robot"></i> AI Assistant
    </button>
    <div class="chatbot-window" id="chatbotWindow">
        <div class="chatbot-header">
            <span><i class="fas fa-robot"></i> BioWeb3 AI</span>
            <button id="closeChatbotBtn">&times;</button>
        </div>
        <div class="chatbot-messages" id="chatbotMessages">
            <div class="message-bubble system-bubble">Ask me about bioinformatics, protein structures, drug discovery, or how to use this platform.</div>
        </div>
        <div class="chatbot-input-area">
            <input type="text" id="chatbotInput" placeholder="Type your question...">
            <button id="chatbotSendBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<footer class="footer"><i class="fas fa-dna"></i> BioWeb3 – AI + Blockchain for Science</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
